    --ok: #4BC17D; --ok-soft: #1B3326; --warn: #E3BA3A; --warn-soft: #383015; --over: #FF8A45; --over-soft: #3D2516;

}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #19201B; --surface-2: #222A24; --line: #323C35;
  --fg: #E6ECE7; --muted: #98A59D; --accent: #8DA5FF; --accent-ink: #0D1430; --accent-soft: #212B4C;
  --ok: #4BC17D; --ok-soft: #1B3326; --warn: #E3BA3A; --warn-soft: #383015; --over: #FF8A45; --over-soft: #3D2516;

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

.app { min-height: 100%; }
.rail {

}

@media (min-width: 900px) {

.track { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; }

.label-box .lt { font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; text-align: center; border-bottom: 2px solid var(--fg); padding-bottom: 6px; margin-bottom: 4px; }

.photo-prev { width: 100%; max-height: 360px; object-fit: contain; border-radius: 10px; background: var(--surface-2); }

.tbl-wrap { overflow-x: auto; }

<script>
'use strict';
/* ========== 工具 ========== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt0 = n => Number.isFinite(n) ? Math.round(n).toLocaleString('zh-TW') : '—';
const fmt1 = n => Number.isFinite(n) ? String(Math.round(n * 10) / 10) : '—';
const num = (v, d = null) => { const n = typeof v === 'string' ? parseFloat(v) : v; return Number.isFinite(n) ? n : d; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const todayTW = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date());
const nowTimeTW = () => new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const wd = d => WD[new Date(d + 'T00:00:00Z').getUTCDay()];
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const dateLabel = d => `${md(d)}（${wd(d)}）${d === todayTW() ? '今天' : ''}`;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}

const DRINK_BASE = {

const SUGAR = { full: ['全糖', 1], less: ['少糖', 0.7], half: ['半糖', 0.5], light: ['微糖', 0.3], none: ['無糖', 0] };
const ICE = { normal: ['正常冰', 0.8], less: ['少冰', 0.9], none: ['去冰／溫熱', 1] };
const SUGAR_G_PER_100ML = 8;      // 全糖約每 100 ml 8 克糖（各店差異大）
const PEARL = { g: 80, k: 120, c: 30 }; // 珍珠每 100 克約 120 大卡；一份約 80 克

const S = {

/* ========== 儲存：claude db（雲端、個人私有）或本機瀏覽器 ========== */
const Store = {
  mode: 'local', base: null, chain: Promise.resolve(),
  async init() {
    let db = null, user = null, id = null;
    try {
      if (window.claude && window.claude.use) {
        [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
        id = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && id) {
      this.mode = 'cloud';
      this.base = db.doc('data/users/' + id + '/profile');
      const onErr = e => { console.warn(e); toast('資料同步中斷，請重新整理頁面。'); };
      this.base.onSnapshot(s => {
        if (this.dirty) return; // 本機還有未送出的修改，以本機為準
        S.profile = Object.assign(clone(DEFAULT_PROFILE), s.exists ? clone(s.data()) : {});
        onData();
      }, onErr);
      this.base.collection('weights').limit(1000).onSnapshot(qs => {
        const w = {}; qs.docs.forEach(d => { const kg = num(d.data().kg); if (kg) w[d.id] = kg; });
        S.weights = w; onData();
      }, onErr);
      this.base.collection('meals').orderBy('date', 'desc').limit(1000).onSnapshot(qs => {
        S.meals = qs.docs.map(d => Object.assign(clone(d.data()), { id: d.id })); onData();
      }, onErr);
    } else {
      this.mode = 'local';
      try {
        const raw = JSON.parse(localStorage.getItem('plate-ruler-v1') || 'null');
        if (raw) { S.profile = Object.assign(clone(DEFAULT_PROFILE), raw.profile || {}); S.weights = raw.weights || {}; S.meals = raw.meals || []; }
      } catch (e) { /* 無法讀取本機儲存 */ }
      onData();
    }
  },
  persistLocal() {
    try { localStorage.setItem('plate-ruler-v1', JSON.stringify({ profile: S.profile, weights: S.weights, meals: S.meals })); }
    catch (e) { toast('這個瀏覽器無法儲存資料（可能是私密瀏覽模式）。'); }
  },
  queue(fn) {
    this.chain = this.chain.then(fn).catch(e => {
      console.warn(e);
      toast(e && e.code === 'quota_exceeded' ? '儲存空間已滿，請刪除部分舊紀錄。' : '儲存失敗，請稍後再試。');
    });
    return this.chain;
  },
  saveProfile() {
    clearTimeout(this.pt);
    this.dirty = true;
    this.pt = setTimeout(() => {
      if (this.mode === 'cloud') this.queue(() => this.base.set(clone(S.profile))).then(() => { if (!this.pt) this.dirty = false; });
      else { this.persistLocal(); this.dirty = false; }
      this.pt = null;
    }, 600);
  },
  saveWeight(date, kg) {
    S.weights[date] = kg;
    if (this.mode === 'cloud') return this.queue(() => this.base.collection('weights').doc(date).set({ date, kg }));
    this.persistLocal(); onData();
  },
  deleteWeight(date) {
    delete S.weights[date];
    if (this.mode === 'cloud') return this.queue(() => this.base.collection('weights').doc(date).delete());
    this.persistLocal(); onData();
  },
  saveMeal(meal) {
    const { id, ...body } = meal;
    const i = S.meals.findIndex(m => m.id === id);
    if (i >= 0) S.meals[i] = meal; else S.meals.unshift(meal);
    if (this.mode === 'cloud') return this.queue(() => this.base.collection('meals').doc(id).set(body));
    this.persistLocal();
  },
  deleteMeal(id) {
    S.meals = S.meals.filter(m => m.id !== id);
    if (this.mode === 'cloud') return this.queue(() => this.base.collection('meals').doc(id).delete());
    this.persistLocal(); onData();
  },
};

/* ========== 計算 ========== */
function latestWeight(upTo) {
  const ds = Object.keys(S.weights).filter(d => !upTo || d <= upTo).sort();
  if (!ds.length) return null;
  const d = ds[ds.length - 1]; return { date: d, kg: S.weights[d] };
}
function targets() {
  const p = S.profile, w = latestWeight();
  const missing = [];
  if (!num(p.height)) missing.push('身高');
  if (!num(p.age)) missing.push('年齡');
  if (!p.sex) missing.push('生理性別');
  if (!w) missing.push('體重');
  if (missing.length) return { ok: false, missing };
  const h = num(p.height), a = num(p.age), kg = w.kg;
  const sexAdj = p.sex === 'male' ? 5 : -161;
  const bmr = 10 * kg + 6.25 * h - 5 * a + sexAdj;
  const act = ACT[p.activity] || ACT.light;
  const tdee = bmr * act.f;
  let raw;
  if (p.goal === 'lose') raw = tdee - clamp(num(p.deficit, 400), 300, 500);
  else if (p.goal === 'gain') raw = tdee + 300;
  else if (p.goal === 'custom') raw = num(p.customKcal, Math.round(tdee));
  else raw = tdee;
  const belowBmr = raw < bmr;
  const kcal = Math.round(belowBmr ? bmr : raw);
  const protein = clamp(num(p.proteinPerKg, 1.2), 0.5, 3) * kg;
  const fatPct = clamp(num(p.fatPct, 27.5), 10, 50);
  const fat = kcal * fatPct / 100 / 9;
  const carb = (kcal - protein * 4 - fat * 9) / 4;
  return { ok: true, kg, wDate: w.date, h, a, sexAdj, bmr, act, tdee, raw, belowBmr, kcal, protein, fat, carb, fatPct };
}
function itemNut(it) {
  if (it.src === 'drink') return drinkNut(it.drink || {});
  const per = it.src === 'db' ? FOODS[it.key] : it.per100;
  const g = num(it.grams, 0);
  if (!per) return { k: 0, p: 0, f: 0, c: 0 };
  return { k: num(per.k, 0) * g / 100, p: num(per.p, 0) * g / 100, f: num(per.f, 0) * g / 100, c: num(per.c, 0) * g / 100 };
}
function drinkNut(d) {
  const base = DRINK_BASE[d.base] || DRINK_BASE.creamer;
  const ml = clamp(num(d.ml, 500), 0, 2000);
  const liquid = ml * (ICE[d.ice] || ICE.normal)[1];
  const sugarG = SUGAR_G_PER_100ML * (SUGAR[d.sugar] || SUGAR.half)[1] * liquid / 100;
  const pearlG = d.pearls ? num(d.pearlG, PEARL.g) : 0;
  return {
    k: base.k * liquid / 100 + sugarG * 4 + PEARL.k * pearlG / 100,
    p: base.p * liquid / 100, f: base.f * liquid / 100,
    c: base.c * liquid / 100 + sugarG + PEARL.c * pearlG / 100,
  };
}
function sumItems(items) {
  return items.reduce((t, it) => { const n = itemNut(it); t.k += n.k; t.p += n.p; t.f += n.f; t.c += n.c; return t; }, { k: 0, p: 0, f: 0, c: 0 });
}
const mealsOn = d => S.meals.filter(m => m.date === d);
const sumMeals = ms => ms.reduce((t, m) => { const n = sumItems(m.items || []); t.k += n.k; t.p += n.p; t.f += n.f; t.c += n.c; return t; }, { k: 0, p: 0, f: 0, c: 0 });
function guessType() {
  const t = nowTimeTW();
  if (t < '10:30') return '早餐'; if (t < '14:30') return '午餐'; if (t < '17:00') return '點心'; if (t < '21:00') return '晚餐'; return '點心';
}
const statusOf = (v, t) => { const r = v / t; return r > 1 ? 'over' : r >= 0.9 ? 'warn' : 'ok'; };
const MACROS = [['k', '熱量', '大卡', fmt0], ['p', '蛋白質', '克', fmt1], ['f', '脂肪', '克', fmt1], ['c', '碳水化合物', '克', fmt1]];
const tgtOf = (T, key) => ({ k: T.kcal, p: T.protein, f: T.fat, c: T.carb })[key];

function sentence(eaten, T, prefix = '今日') {
  const parts = [];
  const dk = eaten.k - T.kcal;
  parts.push(dk > 0 ? `${prefix}熱量已超出 ${fmt0(dk)} 大卡` : `${prefix}熱量還有 ${fmt0(-dk)} 大卡`);
  const dp = T.protein - eaten.p;
  if (dp >= 3) parts.push(`蛋白質還差 ${fmt0(dp)} 克`); else parts.push('蛋白質已達標');
  const df = eaten.f - T.fat;
  if (df > 3) parts.push(`脂肪多了 ${fmt0(df)} 克`);
  return parts.join('，') + '。';
}

/* ========== 共用畫面元件 ========== */
function barRow(label, val, target, unit, f) {
  if (!(target > 0)) return `<div class="bar-row"><div class="top"><span class="lbl">${label}</span><span class="val">${f(val)} ${unit}</span></div><div class="track"></div></div>`;
  const st = statusOf(val, target), pct = clamp(val / target, 0, 1) * 100;
  const state = val > target ? `超出 ${f(val - target)} ${unit}` : `剩餘 ${f(target - val)} ${unit}`;
  return `<div class="bar-row ${st}"><div class="top"><span class="lbl">${label}</span><span class="val">${f(val)}／${f(target)} ${unit}</span></div>
    <div class="track" role="img" aria-label="${label} ${Math.round(val / target * 100)}%"><div class="fill" style="width:${pct}%"></div></div>
    <div class="state">${state}</div></div>`;
}
function previewRow(label, before, add, target, unit, f) {
  const after = before + add, st = statusOf(after, target);
  const w1 = clamp(before / target, 0, 1) * 100, w2 = clamp(after / target, 0, 1) * 100 - w1;
  const state = after > target ? `加入後超出 ${f(after - target)} ${unit}` : `加入後剩餘 ${f(target - after)} ${unit}`;
  return `<div class="bar-row ${st}"><div class="top"><span class="lbl">${label}</span><span class="val">${f(before)} → <b>${f(after)}</b>／${f(target)}</span></div>
    <div class="track"><div class="fill" style="width:${w1}%"></div><div class="fill add" style="left:${w1}%;width:${w2}%"></div></div>
    <div class="state">${state}</div></div>`;
}
function labelBox(t, title = '營養標示') {
  return `<div class="label-box"><div class="lt">${title}</div>
    <div class="lr kcal"><span>熱量</span><span>${fmt0(t.k)} 大卡</span></div>
    <div class="lr"><span>蛋白質</span><span>${fmt1(t.p)} 公克</span></div>
    <div class="lr"><span>脂肪</span><span>${fmt1(t.f)} 公克</span></div>
    <div class="lr"><span>碳水化合物</span><span>${fmt1(t.c)} 公克</span></div></div>`;
}
function setupCard(T) {
  return `<div class="banner info"><b>還差一些資料才能算出每日額度</b>
    <p class="small">尚未填寫：${T.missing.join('、')}。</p>
    <div class="row"><a class="btn sm primary" href="#settings">填寫個人資料</a><a class="btn sm" href="#weight">記錄體重</a></div></div>`;
}

/* ========== 今日 ========== */
function renderToday() {
  const d = S.viewDate, T = targets(), ms = mealsOn(d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const eaten = sumMeals(ms);
  const bars = T.ok
    ? MACROS.map(([k, l, u, f]) => barRow(l, eaten[k], tgtOf(T, k), u, f)).join('')
    : MACROS.map(([k, l, u, f]) => barRow(l, eaten[k], 0, u, f)).join('');
  const sum = !ms.length ? '這天還沒有紀錄。' : T.ok ? sentence(eaten, T, d === todayTW() ? '今日' : '當日') : '';
  const meals = ms.length ? ms.map(m => {
    const t = sumItems(m.items || []);
    return `<div class="meal">
      ${m.thumb ? `<img class="thumb" src="${esc(m.thumb)}" alt="${esc(m.type)}照片">` : `<div class="thumb ph">無照片</div>`}
      <div class="stack" style="gap:4px;min-width:0">
        <div class="row between"><b>${esc(m.type)} <span class="muted small num">${esc(m.time || '')}</span></b><span class="num"><b>${fmt0(t.k)}</b> 大卡</span></div>
        <p class="small muted">${(m.items || []).map(i => esc(i.name)).join('、')}</p>
        <p class="small muted num">蛋白質 ${fmt1(t.p)} 克・脂肪 ${fmt1(t.f)} 克・碳水 ${fmt1(t.c)} 克</p>
        <div class="row"><button class="btn sm" data-act="edit-meal" data-id="${esc(m.id)}">修改</button>
        <button class="btn sm ghost danger" data-act="del-meal" data-id="${esc(m.id)}">刪除</button></div>
      </div></div>`;
  }).join('') : `<div class="empty"><p>還沒有餐點。拍一張照片，或手動新增食物。</p></div>`;
  return `
  <div class="row between"><h1>今日進度</h1>
    <div class="daynav"><button class="btn sm" data-act="day" data-n="-1" aria-label="前一天">◀</button>
    <span class="d">${dateLabel(d)}</span>
    <button class="btn sm" data-act="day" data-n="1" aria-label="後一天" ${d >= todayTW() ? 'disabled' : ''}>▶</button></div></div>
  ${T.ok ? '' : setupCard(T)}
  <div class="grid2">
    <section class="card stack"><div class="row between"><h2>已攝取／額度</h2>${T.ok ? `<span class="small muted">額度 ${fmt0(T.kcal)} 大卡</span>` : ''}</div>
      <div class="bars">${bars}</div>
      ${sum ? `<p class="summary">${sum}</p>` : ''}
      <p class="small muted">單日多一點或少一點都很正常，請以<a href="#week">週平均</a>作為主要參考。</p>
    </section>
    <section class="stack">
      <a class="btn primary big" href="#log" data-act="new-meal">＋ 記錄一餐</a>
      <div class="card stack"><h2>${md(d)} 的餐點</h2>${meals}</div>
    </section>
  </div>`;
}

/* ========== 記錄（拍照 → 分析 → 編輯） ========== */
function refList() {
  const list = Object.entries(REFS).map(([k, v]) => ({ id: k, ...v }));
  (S.profile.customRefs || []).forEach(r => list.push({ id: 'c:' + r.id, name: r.name, desc: r.desc, custom: true }));
  return list;
}
function currentRef() { return refList().find(r => r.id === S.profile.lastRef) || { id: 'coin10', ...REFS.coin10 }; }

function renderLog() {
  if (S.draft) return renderEditor();
  const ref = currentRef();
  const chips = refList().map(r => `<label><input type="radio" name="ref" value="${esc(r.id)}" ${r.id === ref.id ? 'checked' : ''} data-act="pick-ref"><span>${esc(r.name)}<small>${esc(r.desc)}</small></span></label>`).join('');
  const busy = S.analyzing;
  return `
  <h1>記錄一餐</h1>
  <div class="grid2">
  <section class="card stack">
    <div class="eyebrow">第 1 步・放一個參考物在食物旁</div>
    <div class="seg ref-chips" role="radiogroup" aria-label="參考物">${chips}</div>

async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('decode')); img.src = URL.createObjectURL(file); });
  }
}
function drawScaled(img, maxSide) {
  const w = img.width, h = img.height, s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
async function handleFile(file) {
  if (!file) return;
  S.analyzeError = null;
  try {
    const img = await decodeImage(file);
    const big = drawScaled(img, 1568);
    const blob = await new Promise(r => big.toBlob(r, 'image/jpeg', 0.85));
    const thumb = drawScaled(img, 320).toDataURL('image/jpeg', 0.62);
    if (!blob) throw new Error('blob');
    if (S.photo) URL.revokeObjectURL(S.photo.url);
    S.photo = { blob, thumb, url: URL.createObjectURL(blob), w: big.width, h: big.height };
  } catch (e) {
    S.analyzeError = '這張照片無法讀取。請改用 JPEG 或 PNG 格式，或重新拍一張。';
  }
  render();
}

/* ----- AI 分析 ----- */
function buildPrompt(ref, w, h) {
  const list = Object.entries(FOODS).map(([k, v]) => `${k}=${v.n}`).join('、');
  return `你是營養師兼影像量測助理。這張照片（${w}×${h} 像素）是一份台灣餐點。使用者在食物旁放了參考物「${ref.name}」，實際尺寸：${ref.desc}。

請依序完成：
(a) 在照片中找出參考物，用它的已知尺寸換算「每公分約多少像素」(px_per_cm)。
(b) 用這個比例量出每樣食物的長、寬（公分）。
(c) 依食物種類推估厚度或高度（公分），並寫下推估依據（例如碗的深度、肉排的常見厚度）。
(d) 體積 = 長 × 寬 × 厚度 × 形狀係數（長方塊約 0.9，碗裝或堆狀約 0.5–0.65，圓餅狀約 0.75），再乘上該食物常見密度 (g/cm³) 換算成克數。
(e) 為每樣食物標示信心程度「高」「中」「低」，並列出不確定原因（例如：看不出用油量、飯可能壓得很實、被其他食物遮住、看不到碗的深度）。

規則：
- 你只負責辨識食物名稱與估算克數，不要估算熱量。
- 盡量把每樣食物對應到下列資料表鍵值 db_key：${list}。
- 飲料（手搖飲、奶茶、咖啡等）：db_key 填 "drink"，grams 改填估計毫升數，並在 drink 欄位填 {"base":"creamer"(奶精奶茶)|"fresh"(鮮奶茶)|"tea"(純茶),"has_pearls":true|false}。
- 只有資料表中找不到對應時，db_key 填 null，並在 ai_per100g 提供每 100 克估計值 {"kcal":數字,"protein":數字,"fat":數字,"carb":數字}；其餘情況 ai_per100g 填 null。
- 便當請拆成白飯、主菜、各配菜分別列出；骨頭不算重量。
- 若照片中找不到參考物：reference_detected 填 false、px_per_cm 填 null，改用常見餐具尺寸粗估，所有信心程度只能填「低」，並在 retake_advice 說明怎麼重拍。

只回覆一個 JSON 物件，不要任何其他文字。格式範例：
{"reference_detected":true,"reference_note":"左下角的10元硬幣","px_per_cm":42,"foods":[{"name":"白飯","db_key":"rice_white","length_cm":11,"width_cm":9,"est_thickness_cm":3.5,"thickness_basis":"碗裝約半碗高","shape_factor":0.6,"density_g_per_cm3":0.8,"volume_cm3":208,"grams":166,"confidence":"中","uncertainty":["飯可能壓得很實"],"ai_per100g":null,"drink":null}],"retake_advice":""}`;
}
function safeParse(text) {
  if (typeof text !== 'string') return null;
  let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
}
function normalizeResult(raw, ref) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.foods)) throw new Error('Claude 的回覆缺少食物清單。');
  const detected = raw.reference_detected === true;
  const items = raw.foods.slice(0, 20).map(f => {
    if (!f || typeof f !== 'object') return null;
    const name = String(f.name || '未命名食物').slice(0, 40);
    let conf = ['高', '中', '低'].includes(f.confidence) ? f.confidence : '低';
    if (!detected) conf = '低';
    const unc = Array.isArray(f.uncertainty) ? f.uncertainty.filter(x => typeof x === 'string').map(x => x.slice(0, 80)).slice(0, 5) : [];
    const gRaw = num(f.grams);
    const grams = gRaw == null ? null : clamp(Math.round(gRaw), 1, 2000);
    const meas = { l: num(f.length_cm), w: num(f.width_cm), t: num(f.est_thickness_cm), basis: typeof f.thickness_basis === 'string' ? f.thickness_basis.slice(0, 120) : '', shape: num(f.shape_factor), density: num(f.density_g_per_cm3), volume: num(f.volume_cm3), aiGrams: gRaw };
    const base = { id: uid(), name, conf, unc, meas };
    if (f.db_key === 'drink') {
      const d = f.drink && typeof f.drink === 'object' ? f.drink : {};
      const it = drinkItem(grams ? clamp(grams, 100, 1500) : 700, DRINK_BASE[d.base] ? d.base : 'creamer', d.has_pearls !== false);
      return Object.assign(it, base, { unc: unc.concat('甜度與冰塊請依實際點的調整') });
    }
    if (typeof f.db_key === 'string' && FOODS[f.db_key]) {
      return Object.assign(base, { src: 'db', key: f.db_key, grams: grams ?? FOODS[f.db_key].g });
    }
    const ai = f.ai_per100g && typeof f.ai_per100g === 'object' ? f.ai_per100g : null;
    const per = ai ? { k: num(ai.kcal), p: num(ai.protein), f: num(ai.fat), c: num(ai.carb) } : null;
    const valid = per && [per.k, per.p, per.f, per.c].every(v => v != null && v >= 0) && per.k <= 900;
    if (valid) return Object.assign(base, { src: 'ai', per100: per, grams: grams ?? 100 });
    return Object.assign(base, { src: 'manual', per100: { k: 0, p: 0, f: 0, c: 0 }, grams: grams ?? 100, unc: unc.concat('沒有營養數值，請選擇對應食物或手動輸入') });
  }).filter(Boolean);
  return {
    items,
    ref: { name: ref.name, detected, note: typeof raw.reference_note === 'string' ? raw.reference_note.slice(0, 160) : '', pxPerCm: num(raw.px_per_cm) },
    advice: typeof raw.retake_advice === 'string' ? raw.retake_advice.slice(0, 200) : '',
  };
}

    S.draft = newDraft({ items: res.items, thumb: S.photo.thumb, fromPhoto: true, ref: res.ref, advice: res.advice });
  } catch (e) {
    if (e && e.code === 'cancelled') S.analyzeError = null;
    else S.analyzeError = (e && ERR_COPY[e.code]) || (e instanceof Error && e.message) || '分析時發生錯誤，請再試一次。';
  } finally {
    S.analyzing = null; render();
  }
}

/* ========== 週檢視 ========== */
function renderWeek() {
  const end = S.weekEnd, days = Array.from({ length: 7 }, (_, i) => addDays(end, i - 6));
  const T = targets();
  const per = days.map(d => { const ms = mealsOn(d); return { d, has: ms.length > 0, t: sumMeals(ms) }; });
  const logged = per.filter(x => x.has);
  const avg = logged.length ? logged.reduce((a, x) => ({ k: a.k + x.t.k / logged.length, p: a.p + x.t.p / logged.length, f: a.f + x.t.f / logged.length, c: a.c + x.t.c / logged.length }), { k: 0, p: 0, f: 0, c: 0 }) : null;
  // 長條圖
  const W = 640, H = 240, L = 48, R = 12, Tp = 16, B = 34;
  const maxV = Math.max(T.ok ? T.kcal * 1.25 : 0, ...per.map(x => x.t.k), 500);
  const step = maxV > 3000 ? 1000 : 500, top = Math.ceil(maxV / step) * step;
  const y = v => Tp + (H - Tp - B) * (1 - v / top), bw = (W - L - R) / 7;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 7 天每日熱量">`;
  for (let v = 0; v <= top; v += step) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  per.forEach((x, i) => {
    const cx = L + bw * i + bw / 2;
    if (x.has) {
      const st = T.ok ? statusOf(x.t.k, T.kcal) : 'ok';
      svg += `<rect x="${cx - bw * 0.3}" y="${y(x.t.k)}" width="${bw * 0.6}" height="${Math.max(0, y(0) - y(x.t.k))}" rx="4" fill="var(--${st})"><title>${md(x.d)} ${fmt0(x.t.k)} 大卡</title></rect>`;
      svg += `<text x="${cx}" y="${y(x.t.k) - 5}" text-anchor="middle" style="fill:var(--fg)">${fmt0(x.t.k)}</text>`;
    } else svg += `<text x="${cx}" y="${y(0) - 8}" text-anchor="middle">未記錄</text>`;
    svg += `<text x="${cx}" y="${H - 12}" text-anchor="middle">${md(x.d)} ${wd(x.d)}</text>`;
  });
  if (T.ok) svg += `<line x1="${L}" x2="${W - R}" y1="${y(T.kcal)}" y2="${y(T.kcal)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/><text x="${W - R}" y="${y(T.kcal) - 6}" text-anchor="end" style="fill:var(--accent)">額度 ${fmt0(T.kcal)}</text>`;
  svg += `</svg>`;
  let table = '';
  if (avg && T.ok) {
    table = `<div class="tbl-wrap"><table><thead><tr><th>項目</th><th class="n">7 天平均</th><th class="n">每日額度</th><th class="n">達成率</th><th>狀態</th></tr></thead><tbody>${MACROS.map(([k, l, u, f]) => {
      const t = tgtOf(T, k), r = avg[k] / t, st = statusOf(avg[k], t);
      const label = r > 1 ? `平均多 ${f(avg[k] - t)} ${u}` : `平均少 ${f(t - avg[k])} ${u}`;
      return `<tr><td>${l}</td><td class="n">${f(avg[k])} ${u}</td><td class="n">${f(t)} ${u}</td><td class="n">${Math.round(r * 100)}%</td><td><span class="badge" style="color:var(--${st});border-color:var(--${st})">${label}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  return `
  <div class="row between"><h1>週檢視</h1>
    <div class="daynav"><button class="btn sm" data-act="week" data-n="-7" aria-label="前一週">◀</button>
    <span class="d">${md(days[0])}–${md(end)}</span>
    <button class="btn sm" data-act="week" data-n="7" aria-label="後一週" ${end >= todayTW() ? 'disabled' : ''}>▶</button></div></div>
  ${T.ok ? '' : setupCard(T)}
  <section class="card stack"><h2>每日熱量</h2>${svg}</section>
  <section class="card stack"><h2>7 天平均 vs 額度</h2>
    ${avg ? `<p class="small muted">平均以有記錄的 ${logged.length} 天計算；沒有記錄的日子不算進平均，以免把平均拉低。</p>${table || '<p class="muted">填好個人資料與體重後，這裡會顯示和額度的比較。</p>'}` : '<p class="muted">這一週還沒有紀錄。</p>'}
    <p class="summary small">單日超標或不足都很正常，身體是用一段時間的平均來反應的。以週平均作為主要參考就好。</p>
  </section>`;
}

/* ========== 體重 ========== */
const BMI_CATS = [[18.5, '體重過輕'], [24, '健康體位'], [27, '過重'], [30, '輕度肥胖'], [35, '中度肥胖'], [Infinity, '重度肥胖']];
function renderWeight() {
  const w = latestWeight(), h = num(S.profile.height);
  const bmi = w && h ? w.kg / ((h / 100) ** 2) : null;
  const cat = bmi ? BMI_CATS.find(([lim]) => bmi < lim)[1] : null;
  const today = todayTW();
  // 30 天折線圖（沒記錄的日子跳過，不補 0）
  const days = Array.from({ length: 30 }, (_, i) => addDays(today, i - 29));
  const pts = days.map((d, i) => ({ i, d, kg: S.weights[d] })).filter(p => p.kg);
  const W = 640, H = 240, L = 44, R = 14, Tp = 16, B = 30;
  let svg = '';
  if (pts.length) {
    const lo = Math.floor(Math.min(...pts.map(p => p.kg)) - 1), hi = Math.ceil(Math.max(...pts.map(p => p.kg)) + 1);
    const x = i => L + (W - L - R) * i / 29, y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
    const stepY = Math.max(1, Math.ceil((hi - lo) / 4));
    svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 30 天體重">`;
    for (let v = lo; v <= hi; v += stepY) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    [0, 7, 14, 21, 29].forEach(i => { svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${md(days[i])}</text>`; });
    if (pts.length > 1) svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => `${x(p.i)},${y(p.kg)}`).join(' ')}"/>`;
    pts.forEach((p, k) => {
      const last = k === pts.length - 1;
      svg += `<circle cx="${x(p.i)}" cy="${y(p.kg)}" r="${last ? 5.5 : 3.5}" fill="${last ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>${md(p.d)} ${fmt1(p.kg)} 公斤</title></circle>`;
    });
    const lp = pts[pts.length - 1];
    svg += `<text x="${Math.min(x(lp.i), W - R - 30)}" y="${y(lp.kg) - 10}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${fmt1(lp.kg)}</text></svg>`;
  }
  const list = Object.keys(S.weights).sort().reverse().slice(0, 14);
  return `
  <h1>體重紀錄</h1>
  <div class="grid2">
    <section class="stack">
      <div class="card stack"><h2>近 30 天</h2>
        ${svg || '<div class="empty"><p>還沒有體重紀錄。在右邊輸入今天的體重，這裡就會畫出折線圖。</p></div>'}
        <p class="small muted">沒有記錄的日子會直接跳過，不會當成 0。</p></div>
      <div class="card stack"><h2>最近紀錄</h2>
        ${list.length ? `<div class="tbl-wrap"><table><tbody>${list.map(d => `<tr><td class="num">${dateLabel(d)}</td><td class="n">${fmt1(S.weights[d])} 公斤</td><td style="text-align:right"><button class="btn sm ghost danger" data-act="del-weight" data-d="${d}">刪除</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">尚無紀錄。</p>'}</div>
    </section>
    <section class="stack sticky-col">
      <div class="card stack"><h2>記錄體重</h2>
        <div class="row" style="flex-wrap:nowrap">
          <label class="field" style="flex:1">日期<input type="date" id="w-date" value="${today}" max="${today}"></label>
          <label class="field" style="flex:1">體重（公斤）<input type="number" id="w-kg" min="20" max="300" step="0.1" inputmode="decimal" value="${w ? w.kg : ''}"></label>
        </div>
        <button class="btn primary" data-act="save-weight">儲存體重</button>
        <p class="small muted">儲存後會自動重新計算每日額度。同一天再記一次會覆蓋。</p></div>
      <div class="card stack"><h2>BMI</h2>
        ${bmi ? `<p><span class="num" style="font-size:1.8rem;font-weight:600">${fmt1(bmi)}</span>　<b>${cat}</b></p>
          <div class="bmi-wrap"><div class="bmi-pin" style="left:${clamp((bmi - 10) / 30, 0, 1) * 100}%">${fmt1(bmi)}</div>
          <div class="bmi-scale" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>` :
          `<p class="muted">${h ? '記錄體重後顯示。' : '請先到設定填寫身高。'}</p>`}
        <div class="tbl-wrap"><table><thead><tr><th>衛福部成人 BMI 分級</th><th class="n">範圍</th></tr></thead><tbody>
          <tr><td>體重過輕</td><td class="n">BMI &lt; 18.5</td></tr>
          <tr><td>健康體位</td><td class="n">18.5 ≤ BMI &lt; 24</td></tr>
          <tr><td>過重</td><td class="n">24 ≤ BMI &lt; 27</td></tr>
          <tr><td>輕度肥胖</td><td class="n">27 ≤ BMI &lt; 30</td></tr>
          <tr><td>中度肥胖</td><td class="n">30 ≤ BMI &lt; 35</td></tr>
          <tr><td>重度肥胖</td><td class="n">BMI ≥ 35</td></tr></tbody></table></div>
        <p class="small muted">BMI = 體重（公斤）÷ 身高（公尺）²。BMI 不區分肌肉與脂肪，僅供參考。</p></div>
    </section>
  </div>`;
}

/* ========== 設定 ========== */

      <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="kcal-step" data-n="-50">−50</button>

        <button class="btn sm" data-act="kcal-step" data-n="50">+50</button></div>

      <p class="small muted">你的 BMR 是 ${fmt0(T.bmr)} 大卡，目標不會低於這個數字。</p></div>`;
  } else gc.innerHTML = '';
}
function setProfile(name, raw, el) {
  const p = S.profile;
  if (['height', 'age', 'proteinPerKg', 'fatPct', 'deficit', 'customKcal'].includes(name)) {
    const v = num(raw); p[name] = v;
    if (name === 'customKcal') document.querySelectorAll('[name="customKcal"]').forEach(x => { if (x !== el && v != null) x.value = v; });
  } else p[name] = raw;
  Store.saveProfile();
  if (name === 'goal' && raw === 'custom' && p.customKcal == null) { const T = targets(); if (T.ok) p.customKcal = Math.round(T.tdee); }
  // 拖曳滑桿時不重建目標控制項，避免中斷操作
  if (name === 'customKcal' || name === 'deficit') {
    const lbl = el && el.closest('label') && el.closest('label').querySelector('b.num'); if (lbl) lbl.textContent = raw;
    renderSettingsDerived(false);
    return;
  }
  renderSettingsDerived();
}

/* ========== 路由與渲染 ========== */
const PAGES = { today: renderToday, log: renderLog, week: renderWeek, weight: renderWeight, settings: renderSettings };
function render() {
  if (!S.ready) return;
  const main = $('#main');
  main.innerHTML = PAGES[S.page]();
  document.querySelectorAll('.rail a').forEach(a => { if (a.dataset.page === S.page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (S.page === 'log' && S.draft) updateEditorDerived();
  if (S.page === 'settings') renderSettingsDerived();
}
function onData() {
  if (!S.ready) { S.ready = true; render(); return; }
  // 正在輸入時不要整頁重繪
  if (S.page === 'settings') { const gc = $('#goal-ctl'); renderSettingsDerived(!(gc && gc.contains(document.activeElement))); return; }
  if (S.page === 'log') { if (S.draft) updateEditorDerived(); return; }
  if (document.activeElement && $('#main').contains(document.activeElement) && document.activeElement.matches('input,select')) return;
  render();
}
function route() {
  const h = (location.hash || '#today').slice(1);
  S.page = PAGES[h] ? h : 'today';
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ========== 事件 ========== */
const main = $('#main');
main.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, D = S.draft;
  const itemEl = b.closest('.item'), item = itemEl && D ? D.items.find(i => i.id === itemEl.dataset.id) : null;
  switch (act) {
    case 'day': { const d = addDays(S.viewDate, +b.dataset.n); if (d <= todayTW()) { S.viewDate = d; render(); } break; }
    case 'week': { const d = addDays(S.weekEnd, +b.dataset.n); S.weekEnd = d > todayTW() ? todayTW() : d; render(); break; }
    case 'new-meal': S.draft = null; break;
    case 'edit-meal': {
      const m = S.meals.find(x => x.id === b.dataset.id); if (!m) return;
      S.draft = Object.assign(clone(m), { existing: true, fromPhoto: false });
      location.hash = '#log'; if (S.page === 'log') render(); break;
    }
    case 'del-meal':
      if (b.dataset.confirm) { Store.deleteMeal(b.dataset.id); toast('已刪除這一餐'); }
      else { b.dataset.confirm = '1'; b.textContent = '確定刪除？'; }
      break;
    case 'add-ref': {
      const name = $('#cr-name').value.trim(), desc = $('#cr-desc').value.trim();
      if (!name || !desc) { toast('請填寫名稱和尺寸'); return; }
      const r = { id: uid(), name: name.slice(0, 30), desc: desc.slice(0, 60) };
      S.profile.customRefs = (S.profile.customRefs || []).concat(r);
      S.profile.lastRef = 'c:' + r.id; Store.saveProfile(); render(); toast('已新增參考物'); break;
    }
    case 'del-ref':
      S.profile.customRefs = (S.profile.customRefs || []).filter(r => r.id !== b.dataset.id);
      if (S.profile.lastRef === 'c:' + b.dataset.id) S.profile.lastRef = 'coin10';
      Store.saveProfile(); render(); break;
    case 'analyze': analyze(); break;
    case 'stop': if (S.analyzing) S.analyzing.ctl.abort(); break;
    case 'manual': S.draft = newDraft(); render(); break;
    case 'manual-drink': S.draft = newDraft({ items: [drinkItem()] }); render(); break;
    case 'retake': S.draft = null; S.photo = null; render(); break;
    case 'cancel': S.draft = null; if (D && D.existing) location.hash = '#today'; else render(); break;
    case 'del-item': D.items = D.items.filter(i => i !== item); render(); break;
    case 'add-food': { const k = $('#add-key').value; if (FOODS[k]) { D.items.push(dbItem(k)); render(); } break; }
    case 'add-other': D.items.push({ id: uid(), name: '其他食物', src: 'manual', per100: { k: 0, p: 0, f: 0, c: 0 }, grams: 100, unc: ['請輸入每 100 克的營養數值（可參考包裝營養標示）'] }); render(); break;
    case 'add-drink': D.items.push(drinkItem()); render(); break;
    case 'save-meal': {
      if (!D.items.length) { toast('請至少加入一樣食物'); return; }
      const date = $('#d-date').value || todayTW();
      const meal = {
        id: D.id, date, type: $('#d-type').value, time: D.time || nowTimeTW(),
        items: D.items, thumb: D.thumb || null, ref: D.ref || null, createdAt: D.createdAt || new Date().toISOString(),
      };
      Store.saveMeal(meal);
      S.draft = null; S.photo = null; S.viewDate = date;
      toast(D.existing ? '已儲存修改' : '已儲存這一餐');
      location.hash = '#today'; if (S.page === 'today') render();
      break;
    }
    case 'save-weight': {
      const d = $('#w-date').value, kg = num($('#w-kg').value);
      if (!d || !kg || kg < 20 || kg > 300) { toast('請輸入 20–300 之間的體重'); return; }
      Store.saveWeight(d, Math.round(kg * 10) / 10); render(); toast('已記錄體重，每日額度已更新'); break;
    }
    case 'del-weight':
      if (b.dataset.confirm) Store.deleteWeight(b.dataset.d);
      else { b.dataset.confirm = '1'; b.textContent = '確定？'; }
      break;
    case 'reset-macro': S.profile.proteinPerKg = 1.2; S.profile.fatPct = 27.5; Store.saveProfile(); render(); break;
    case 'kcal-step': case 'kcal-set': {
      const T = targets(); if (!T.ok) return;
      const v = act === 'kcal-set' ? +b.dataset.v : num(S.profile.customKcal, Math.round(T.tdee)) + +b.dataset.n;
      S.profile.customKcal = clamp(Math.round(v), 800, 6000); Store.saveProfile(); renderSettingsDerived(); break;
    }
  }
});
main.addEventListener('input', e => {
  const el = e.target, act = el.dataset.act, D = S.draft;
  const itemEl = el.closest('.item'), item = itemEl && D ? D.items.find(i => i.id === itemEl.dataset.id) : null;
  if (act === 'grams' && item) {
    const g = clamp(num(el.value, 0), 0, 3000); item.grams = g;
    itemEl.querySelectorAll('[data-act="grams"]').forEach(x => { if (x !== el) { if (x.type === 'range' && g > +x.max) x.max = Math.ceil(g / 50) * 50; x.value = Math.round(g); } });
    updateItemCard(item.id);
  } else if (act === 'per100' && item) {
    item.per100 = Object.assign({}, item.per100, { [el.dataset.f]: clamp(num(el.value, 0), 0, 900) });
    if (item.src === 'ai') { item.src = 'manual'; const bd = itemEl.querySelector('.badge.ai'); if (bd) { bd.className = 'badge'; bd.textContent = '手動數值'; } }
    updateItemCard(item.id);
  } else if (act === 'drink' && item && el.dataset.f === 'ml') {
    item.drink.ml = clamp(num(el.value, 0), 0, 2000); updateItemCard(item.id);
  } else if (act === 'rename' && item) {
    item.name = el.value.slice(0, 40);
  } else if (act === 'prof' && el.type !== 'radio') {
    setProfile(el.name, el.value, el);
  }
});
main.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act, D = S.draft;
  const itemEl = el.closest('.item'), item = itemEl && D ? D.items.find(i => i.id === itemEl.dataset.id) : null;
  if (act === 'file') { handleFile(el.files && el.files[0]); el.value = ''; }
  else if (act === 'pick-ref') { S.profile.lastRef = el.value; Store.saveProfile(); }
  else if (act === 'fine') { S.profile.fineMode = el.checked; Store.saveProfile(); }
  else if (act === 'prof' && el.type === 'radio') { setProfile(el.name, el.value, el); }
  else if (act === 'meta' && D) { if (el.id === 'd-date') D.date = el.value || todayTW(); else D.type = el.value; updateEditorDerived(); }
  else if (act === 'map' && item) {
    if (el.value && FOODS[el.value]) { item.src = 'db'; item.key = el.value; if (!item.name || item.name === '其他食物') item.name = FOODS[el.value].n; }
    else if (item.src === 'db') { item.src = 'manual'; const f = FOODS[item.key]; item.per100 = { k: f.k, p: f.p, f: f.f, c: f.c }; }
    render();
  } else if (act === 'drink' && item) {
    const d = item.drink, f = el.dataset.f;
    if (f === 'size') { if (el.value !== 'x') d.ml = +el.value; render(); return; }
    if (f === 'pearls') d.pearls = el.value === '1';
    else if (f !== 'ml') d[f] = el.value;
    updateItemCard(item.id);
  }
});

/* ========== 啟動 ========== */
(async function boot() {
  const samplePromise = (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const sample = await claude.use('sample');
      if (!sample) return;
      const lim = await sample.limits().catch(() => null);
      if (lim && lim.images) { S.sample = sample; S.canImages = true; }
    } catch (e) { /* 無法使用 AI 分析 */ }
    if (S.ready && S.page === 'log') render();
  })();
  route();
  await Store.init();
  await samplePromise;
})();
</script>
